steps:
  platformArtifacts:
    image: "eclipse-temurin:21-alpine"
    commands:
      - "./gradlew -PnoBump :Plugin:licenseCheck :Plugin:platformJars"
      - "./gradlew :API:javadocJar"


  verify-platform-artifacts:
    image: "eclipse-temurin:21-alpine"
    commands:
      - "find Plugin/build/libs/platform -maxdepth 1 -type f -name '*.jar' -print"
      - "test \"$(find Plugin/build/libs/platform -maxdepth 1 -type f -name 'LibreLogin-Paper-*.jar' | wc -l)\" -eq 1"
      - "test \"$(find Plugin/build/libs/platform -maxdepth 1 -type f -name 'LibreLogin-Velocity-*.jar' | wc -l)\" -eq 1"
      - "set -eu; paper=\"$(find Plugin/build/libs/platform -maxdepth 1 -type f -name 'LibreLogin-Paper-*.jar' | head -1)\"; velocity=\"$(find Plugin/build/libs/platform -maxdepth 1 -type f -name 'LibreLogin-Velocity-*.jar' | head -1)\"; test -f \"$paper\"; test -f \"$velocity\"; paper_list=\"$(mktemp)\"; velocity_list=\"$(mktemp)\"; trap 'rm -f \"$paper_list\" \"$velocity_list\"' EXIT; jar tf \"$paper\" > \"$paper_list\"; jar tf \"$velocity\" > \"$velocity_list\"; ! grep -q '^xyz/kyngs/librelogin/velocity/' \"$paper_list\"; ! grep -q '^xyz/kyngs/librelogin/paper/' \"$velocity_list\"; grep -q '^plugin.yml$' \"$paper_list\"; ! grep -q '^plugin.yml$' \"$velocity_list\"; grep -q '^paper-plugin.yml$' \"$paper_list\"; ! grep -q '^paper-plugin.yml$' \"$velocity_list\""

  publish:
    image: "eclipse-temurin:21-alpine"
    commands:
      - "./gradlew :API:publish -PkyngsRepoUsername=$${KYNGS_REPO_TOKEN} -PkyngsRepoPassword=$${KYNGS_REPO_SECRET}"
    when:
      - event: push
        branch:
          - master
          - dev
    secrets: [ kyngs_repo_token, kyngs_repo_secret ]

  update-wiki:
    image: "alpine"
    commands:
      - "apk update && apk add git"
      - "git clone https://github.com/kyngs/LibreLogin.wiki.git wiki"
      - "cd wiki"
      - "if [ -f ../velocity/plugins/librelogin/config.yml ]; then echo '```yaml' > Config.md && cat ../velocity/plugins/librelogin/config.yml >> Config.md && echo '```' >> Config.md; else echo 'Configuration is generated on first plugin startup.' > Config.md; fi"
      - "if [ -f ../velocity/plugins/librelogin/messages.yml ]; then echo '```yaml' > Messages.md && cat ../velocity/plugins/librelogin/messages.yml >> Messages.md && echo '```' >> Messages.md; else echo 'Messages are generated on first plugin startup.' > Messages.md; fi"
      - "git config --local user.email 'kyngs@users.noreply.github.com'"
      - "git config --local user.name 'Kyngs CI (ci.kyngs.xyz)'"
      - "git add ."
      - "git diff-index --quiet HEAD || git commit -m 'Update configuration and messages on wiki' && git push https://kyngs:$${GITHUB_PERSONAL_TOKEN}@github.com/kyngs/LibreLogin.wiki.git"
    secrets: [ github_personal_token ]
    when:
      - event: push
        branch: master
